/*
 * lionturtle's C API.
 *
 * Functions that can fail return an lt_status, and lt_last_error() describes
 * the failure. Byte arguments are a pointer and a length; the pointer may be
 * null when the length is 0. Each handle goes back to its free function, or
 * to lt_close() for an lt_db. Any number of threads may share an lt_db or an
 * lt_snapshot; use each lt_iter and lt_batch from one thread at a time.
 */"""
