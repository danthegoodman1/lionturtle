[workspace]
members = ["lionturtle", "lionturtle-c", "kvbench"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/danthegoodman1/lionturtle"

[workspace.lints.clippy]
# Every `len` here is a size in bytes or entries, and no caller asks whether
# one is empty.
len_without_is_empty = "allow"
# Offset and page-pointer tuples read more plainly inline than behind
# single-use type aliases.
type_complexity = "allow"

[profile.release]
debug = 1
codegen-units = 4
lto = "thin"

[profile.test]
opt-level = 1
