[package]
name = "lionturtle"
version = "0.5.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "An embedded key-value store built on TurtleKV's TurtleTree, with paced checkpoints for high throughput and short tail latency"
readme = "../README.md"
keywords = ["database", "key-value", "storage", "embedded", "b-epsilon-tree"]
categories = ["database-implementations"]

[lints]
workspace = true

[dependencies]
arc-swap = "1.7"
bbtree = "0.1.5"
boxcar = "0.2"
bytes = "1"
crc32c = "0.6"
crossbeam-skiplist = "0.1"
libc = "0.2"
# The unsafe encoder and decoder are lz4_flex's fastest. checked-decode keeps
# decoding of a corrupt block within its buffers, and alloc lets a block
# decompress into a buffer it need not zero first.
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "checked-decode"] }
parking_lot = { version = "0.12", features = ["arc_lock"] }
parking_lot_core = "0.9"
quick_cache = "0.6"
rayon = "1.10"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
