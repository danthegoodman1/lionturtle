[package]
name = "turtlekv"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "A Rust implementation of TurtleKV: a key-value store built on TurtleTrees (B^ε+-trees) with checkpoint-distance tuning."

[dependencies]
arc-swap = "1.7"
bbtree = "0.1.5"
boxcar = "0.2"
congee = "0.4"
bytes = "1"
crc32c = "0.6"
crossbeam-skiplist = "0.1"
libc = "0.2"
parking_lot = "0.12"
quick_cache = "0.6"
rayon = "1.10"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
mimalloc = { version = "0.1", default-features = false }
