name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        # The file layer has Linux and macOS code paths; each is linted on
        # its own system.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # kvbench's RocksDB and ScyllaDB drivers compile only with their
      # features, and RocksDB's bindings need libclang.
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev
      - if: runner.os == 'Linux'
        run: cargo clippy -p kvbench --all-features --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux on x86_64 and arm64, and macOS on Apple silicon.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  vopr:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Starts at a random seed, so each run covers new seeds. A failure
      # prints the command that replays its seed.
      - run: cargo run --release --bin vopr -- --seeds 300
